version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    # goconst disabled: flags string literals repeated >=3 times across test
    # fixtures ("default", "app", "Deployment", "* * * * *", alert names).
    # These are normal test data, not constants; enforcing goconst adds
    # noise without catching real bugs. Re-enable if a true constant is
    # found.
    # - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - modernize
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    # logcheck disabled: v0.10.1 panics on Go 1.26 new(expr) syntax.
    # Re-enable when sigs.k8s.io/logtools supports Go 1.26.
    # - logcheck
  settings:
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    modernize:
      disable:
        - omitzero
        # newexpr flags ptr(x) as "can be simplified to new(x)" but on Go 1.26
        # new(value) does not compile (new takes a type, not a value). The
        # linter's suggestion is wrong for pointer-to-value helpers.
        - newexpr
  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
        text: "Error return value of .*.Close. is not checked"
      - linters:
          - errcheck
        text: "Error return value of .*.Write. is not checked"
        path: _test\.go
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/ab0utbla-k/temper)
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
