apiVersion: temper.io/v1alpha1
kind: CronTrial
metadata:
  labels:
    app.kubernetes.io/name: temper
    app.kubernetes.io/managed-by: kustomize
  name: nightly-pod-kill
spec:
  trialRef: pod-kill-sample
  schedule: "0 2 * * 1-5"
  timezone: UTC
  concurrencyPolicy: Forbid
  safeguards:
    minReplicasAvailable: 2
    maxUnavailable: 1
