---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: trials.temper.io
spec:
  group: temper.io
  names:
    kind: Trial
    listKind: TrialList
    plural: trials
    singular: trial
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.outcome
      name: Outcome
      type: string
    - jsonPath: .spec.target.name
      name: Target
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Trial is the Schema for the trials API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Trial
            properties:
              execution:
                description: execution controls how scenarios are run. Defaults to
                  sequential.
                properties:
                  mode:
                    default: sequential
                    description: mode determines whether scenarios run one after another
                      or simultaneously.
                    enum:
                    - sequential
                    - parallel
                    type: string
                  pauseBetween:
                    description: pauseBetween is the wait time between scenarios in
                      sequential mode.
                    type: string
                type: object
              recovery:
                description: |-
                  recovery overrides how recovery is detected. When unset, each scenario's
                  default probe is used.
                properties:
                  http:
                    description: |-
                      http probes recovery with an HTTP GET; a 2xx response means recovered.
                      It checks that the service actually answers, not merely that the
                      workload's readiness probe claims it is ready.
                    properties:
                      url:
                        description: url is the endpoint to probe. A 2xx response
                          means recovered.
                        type: string
                    required:
                    - url
                    type: object
                type: object
              scenarios:
                description: scenarios is the ordered list of fault injection steps.
                items:
                  description: Scenario defines a single fault injection step.
                  properties:
                    duration:
                      description: duration is how long this scenario runs before
                        reverting.
                      type: string
                    nodeDrain:
                      description: |-
                        nodeDrain configures the node-drain scenario. Only read when type is
                        "node-drain"; omitted means default behavior (drain the busiest node).
                      properties:
                        evictionTimeout:
                          description: |-
                            evictionTimeout is how long blocked evictions are retried before the
                            trial concludes Blocked. Unset means 30s.
                          type: string
                        nodeName:
                          description: |-
                            nodeName pins the drain to this node. Empty means the scenario picks
                            the node running the most target pods.
                          type: string
                      type: object
                    podKill:
                      description: podKill configures the pod-kill scenario. Required
                        when type is "pod-kill".
                      properties:
                        count:
                          default: 1
                          description: count is the number of pods to kill at a time.
                          format: int32
                          minimum: 1
                          type: integer
                        interval:
                          description: interval is the time between repeated kills.
                            If unset, pods are killed once.
                          type: string
                      required:
                      - count
                      type: object
                    type:
                      description: type selects which fault to inject.
                      enum:
                      - pod-kill
                      - node-drain
                      type: string
                  required:
                  - duration
                  - type
                  type: object
                minItems: 1
                type: array
              target:
                description: target specifies which workload to inject faults into.
                properties:
                  kind:
                    description: kind is the target resource type (e.g., Deployment).
                    enum:
                    - Deployment
                    type: string
                  name:
                    description: name targets a specific resource by name. Mutually
                      exclusive with selector.
                    type: string
                  selector:
                    description: selector targets resources by label. Mutually exclusive
                      with name.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                required:
                - kind
                type: object
            required:
            - scenarios
            - target
            type: object
          status:
            description: status defines the observed state of Trial
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the Trial resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentScenarioIndex:
                description: currentScenarioIndex is the zero-based index of the currently
                  executing scenario.
                format: int32
                type: integer
              haltReason:
                description: haltReason explains why a safeguard stopped the trial.
                  Only set when phase is Halted.
                type: string
              injectedAt:
                description: injectedAt is when the current scenario's fault was injected.
                format: date-time
                type: string
              injectionIncomplete:
                description: |-
                  injectionIncomplete reports that the current scenario's Inject has
                  work left (e.g. evictions blocked by a PDB) and will be called again.
                type: boolean
              metrics:
                description: metrics tracks aggregate trial results.
                properties:
                  meanRecoveryTime:
                    description: meanRecoveryTime is the average time for the target
                      to recover after injection.
                    type: string
                  totalPodsKilled:
                    description: totalPodsKilled is the number of pods deleted across
                      all runs.
                    format: int32
                    type: integer
                type: object
              outcome:
                description: |-
                  outcome is what the experiment concluded. Empty until a verdict exists,
                  and never set when the controller itself failed (phase Failed).
                enum:
                - Passed
                - Blocked
                - Failed
                - Halted
                type: string
              phase:
                description: phase is the current lifecycle stage of the trial.
                enum:
                - Pending
                - Running
                - Completed
                - Failed
                - Halted
                type: string
              recoveredAt:
                description: recoveredAt is when the target recovered from the current
                  scenario's fault.
                format: date-time
                type: string
              scenarioResults:
                description: scenarioResults records the per-scenario timeline, in
                  execution order.
                items:
                  description: ScenarioResult records what one scenario run concluded.
                  properties:
                    findings:
                      description: |-
                        findings are noteworthy, non-fatal conditions observed during the run
                        (e.g. a PDB-blocked eviction).
                      items:
                        description: Finding is one noteworthy, non-fatal condition
                          observed during a scenario run.
                        properties:
                          message:
                            description: message is a human-readable explanation of
                              the finding.
                            type: string
                          reason:
                            description: |-
                              reason is a machine-readable token identifying the finding kind
                              (e.g. EvictionBlocked).
                            type: string
                        required:
                        - reason
                        type: object
                      type: array
                    injectedAt:
                      description: injectedAt is when the fault was injected.
                      format: date-time
                      type: string
                    recoveredAt:
                      description: |-
                        recoveredAt is when the recovery probe first succeeded. Unset means the
                        target never recovered within the scenario's duration.
                      format: date-time
                      type: string
                    type:
                      description: type is the scenario that ran.
                      enum:
                      - pod-kill
                      - node-drain
                      type: string
                  required:
                  - injectedAt
                  - type
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
