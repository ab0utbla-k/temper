# Demonstrates: risk detection on a StatefulSet
#                (SingleReplica + NoPodAntiAffinity + MissingReadinessProbe +
#                 NoPodDisruptionBudget)
#
# There is deliberately no Trial here. A Trial cannot target a StatefulSet —
# the scenarios only inject into Deployments — so spec.target.kind rejects it.
# The rules read a StatefulSet fine, though, so lint it with the read-only
# scanner instead:
#
#   kubectl apply -f examples/risks/statefulset_target.yaml
#   make riskscan RISKSCAN_NAMESPACE=default
#
# That is the point of the scanner: static checks are cheap and safe, so they
# should not require injecting a fault to get at them.
apiVersion: v1
kind: Service
metadata:
  name: risk-statefulset
  labels:
    app.kubernetes.io/name: temper
spec:
  clusterIP: None
  selector:
    app: risk-statefulset
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: risk-statefulset
  labels:
    app.kubernetes.io/name: temper
spec:
  serviceName: risk-statefulset
  replicas: 1
  selector:
    matchLabels:
      app: risk-statefulset
  template:
    metadata:
      labels:
        app: risk-statefulset
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
